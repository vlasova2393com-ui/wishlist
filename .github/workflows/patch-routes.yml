name: Patch wishlist routes
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch routes and guest UI
        run: |
          if grep -q "const id = location.pathname.match" src/main.jsx; then
            echo "Patch already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          replacements = [
            ("const [selected, setSelected] = useState(() => location.pathname.endsWith('/julia') ? LISTS[0] : null)", "const [selected, setSelected] = useState(() => { const id = location.pathname.match(/\\/(julia|sergey|shared)\\/?$/)?.[1]; return LISTS.find(x => x.id === id) || null })"),
            ("const open = (list) => { setSelected(list); if (list.id === 'julia') history.pushState({}, '', `${import.meta.env.BASE_URL}julia`) }", "const open = (list) => { setSelected(list); history.pushState({}, '', `${import.meta.env.BASE_URL}${list.id}`) }"),
            ("<button className=\"back\" onClick={onBack}>← Все списки</button>", "{!publicList && <button className=\"back\" onClick={onBack}>← Все списки</button>}"),
            ("<div className=\"hero-actions\">{session ? <button className=\"secondary\" onClick={logout}><LogOut size={16} /> Выйти</button> : <button className=\"primary\" onClick={() => setAuthOpen(true)}><LogIn size={17} /> Войти</button>}{canEdit && <button className=\"primary\" onClick={() => addWish(categories[0])}><Plus size={18} /> Добавить</button>}</div>", "<div className=\"hero-actions\">{!publicList && (session ? <button className=\"secondary\" onClick={logout}><LogOut size={16} /> Выйти</button> : <button className=\"primary\" onClick={() => setAuthOpen(true)}><LogIn size={17} /> Войти</button>)}{canEdit && <button className=\"primary\" onClick={() => addWish(categories[0])}><Plus size={18} /> Добавить</button>}</div>"),
            ("emailRedirectTo: location.href", "emailRedirectTo: `${location.origin}${location.pathname.replace(/\\/$/, '') || import.meta.env.BASE_URL}`"),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'pattern not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: patch wishlist routes"
          git push